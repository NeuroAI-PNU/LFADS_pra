_target_: lfads_torch.model.LFADS
encod_data_dim: 4
encod_seq_len: 150
recon_seq_len: 150
ext_input_dim: 0
ic_enc_seq_len: 0
ic_enc_dim: 32
ci_enc_dim: 32
ci_lag: 1
con_dim: 64
co_dim: 2
ic_dim: 16
gen_dim: 32
fac_dim: 4
readin:
- _target_: torch.nn.Identity
readout:
  _target_: torch.nn.ModuleList
  modules:
  - _target_: lfads_torch.modules.readin_readout.FanInLinear
    in_features: ${model.fac_dim}
    out_features: 4
train_aug_stack:
  _target_: lfads_torch.modules.augmentations.AugmentationStack
  transforms:
  - _target_: lfads_torch.modules.augmentations.CoordinatedDropout
    cd_rate: 0.3
    cd_pass_rate: 0.0
    ic_enc_seq_len: ${model.ic_enc_seq_len}
  batch_order:
  - 0
  loss_order:
  - 0
infer_aug_stack:
  _target_: lfads_torch.modules.augmentations.AugmentationStack
reconstruction:
- _target_: lfads_torch.modules.recons.Poisson
variational: true
co_prior:
  _target_: lfads_torch.modules.priors.AutoregressiveMultivariateNormal
  tau: 10.0
  nvar: 0.1
  shape: ${model.co_dim}
ic_prior:
  _target_: lfads_torch.modules.priors.MultivariateNormal
  mean: 0
  variance: 0.1
  shape: ${model.ic_dim}
ic_post_var_min: 0.0001
dropout_rate: 0.3
cell_clip: 5.0
loss_scale: 10000.0
recon_reduce_mean: true
lr_init: 0.004
lr_stop: 1.0e-05
lr_decay: 0.95
lr_patience: 6
lr_adam_beta1: 0.9
lr_adam_beta2: 0.999
lr_adam_epsilon: 1.0e-08
lr_scheduler: false
weight_decay: 0.0
l2_start_epoch: 0
l2_increase_epoch: 80
l2_ic_enc_scale: 0.0
l2_ci_enc_scale: 0.0
l2_gen_scale: 0.0
l2_con_scale: 0.0
kl_start_epoch: 0
kl_increase_epoch: 80
kl_ic_scale: 1.0e-07
kl_co_scale: 1.0e-07
